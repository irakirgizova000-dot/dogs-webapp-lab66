
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#292520">
    <title>Мир собак</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header>
        <h1>🐕 Мир собак</h1>
        <p>Выбери породу и узнай о ней больше</p>
    </header>

    <main class="container">
        <section class="dogs" aria-label="Каталог пород">
            <article class="dog-card">
                <img src="images/labrador.jpg" alt="Лабрадор">
                <h3>Лабрадор</h3>
                <button class="select-button" data-dog="labrador">Выбрать</button>
            </article>

            <article class="dog-card">
                <img src="images/shepherd.jpg" alt="Немецкая овчарка">
                <h3>Немецкая овчарка</h3>
                <button class="select-button" data-dog="shepherd">Выбрать</button>
            </article>

            <article class="dog-card">
                <img src="images/husky.jpg" alt="Хаски">
                <h3>Хаски</h3>
                <button class="select-button" data-dog="husky">Выбрать</button>
            </article>

            <article class="dog-card">
                <img src="images/pug.jpg" alt="Мопс">
                <h3>Мопс</h3>
                <button class="select-button" data-dog="pug">Выбрать</button>
            </article>

            <article class="dog-card">
                <img src="images/bulldog.jpg" alt="Бульдог">
                <h3>Бульдог</h3>
                <button class="select-button" data-dog="bulldog">Выбрать</button>
            </article>

            <article class="dog-card">
                <img src="images/dachshund.jpg" alt="Такса">
                <h3>Такса</h3>
                <button class="select-button" data-dog="dachshund">Выбрать</button>
            </article>

            <article class="dog-card">
                <img src="images/poodle.jpg" alt="Пудель">
                <h3>Пудель</h3>
                <button class="select-button" data-dog="poodle">Выбрать</button>
            </article>

            <article class="dog-card">
                <img src="images/chihuahua.jpg" alt="Чихуахуа">
                <h3>Чихуахуа</h3>
                <button class="select-button" data-dog="chihuahua">Выбрать</button>
            </article>
        </section>

        <p id="status" role="status">Нажми «Выбрать» у понравившейся породы.</p>

        <button id="confirm-button" disabled>
            Показать информацию
        </button>
    </main>

    <script src="app.js"></script>
</body>
</html>
